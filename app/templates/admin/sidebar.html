<div class="admin-sidebar p-3 h-100">
    <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
        <div class="d-flex align-items-center">
            <i class="fas fa-solar-panel text-primary me-2"></i>
            <span class="fw-bold">SolarForms</span>
        </div>
    </div>
    
    <div class="sidebar-links">
        <a href="{{ url_for('admin_dashboard') }}" class="sidebar-link mb-2 {% if request.endpoint == 'admin_dashboard' %}active{% endif %}">
            <span class="sidebar-icon"><i class="fas fa-tachometer-alt"></i></span>
            Dashboard
        </a>
        
        <a href="{{ url_for('admin_formularios') }}" class="sidebar-link mb-2 {% if request.endpoint == 'admin_formularios' or request.endpoint == 'visualizar_formulario' %}active{% endif %}">
            <span class="sidebar-icon"><i class="fas fa-clipboard-list"></i></span>
            Formulários
        </a>
        
        {% if current_user.admin %}
        <a href="{{ url_for('admin_usuarios') }}" class="sidebar-link mb-2 {% if request.endpoint == 'admin_usuarios' or request.endpoint == 'adicionar_usuario' or request.endpoint == 'editar_usuario' %}active{% endif %}">
            <span class="sidebar-icon"><i class="fas fa-users-cog"></i></span>
            Usuários
        </a>
        {% endif %}
        
        <a href="{{ url_for('exportar_csv') }}" class="sidebar-link mb-2">
            <span class="sidebar-icon"><i class="fas fa-file-csv"></i></span>
            Exportar CSV
        </a>
        
        <hr>
        
        <a href="{{ url_for('logout') }}" class="sidebar-link mb-2 text-danger">
            <span class="sidebar-icon"><i class="fas fa-sign-out-alt"></i></span>
            Sair
        </a>
    </div>
</div>
